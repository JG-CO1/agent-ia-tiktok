<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autorisation TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;background:#0b0d12;color:#f4f6fb}code{display:block;padding:16px;background:#111725;border-radius:12px;word-break:break-all;font-size:15px}p{color:#9ea7bb}</style></head>
<body>
<h1>Autorisation TikTok</h1>
<p>Copie ce code, puis lance sur ton ordinateur : <b>npm run fm -- auth tiktok --code &lt;CODE&gt;</b></p>
<code id="c">(aucun code)</code>
<p id="e"></p>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("code")) document.getElementById("c").textContent = q.get("code");
  if (q.get("error")) document.getElementById("e").textContent = "Erreur : " + q.get("error") + " — " + (q.get("error_description") || "");
</script>
</body>
</html>
