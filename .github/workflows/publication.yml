name: Publication

# Chaque passage publie les épisodes approuvés dont l'heure est arrivée sur chaque plateforme (config/chaine.json >
# horaires) et vérifie l'état en ligne. YouTube est programmé dès l'approbation (publishAt : YouTube publie seul, à
# l'heure) ; TikTok et Instagram partent ici. Les déclenchements planifiés de GitHub sont souvent en retard ou sautés :
# en plus du passage horaire (hh:17), trois passages (hh:29, hh:41, hh:53) suivent chaque créneau TikTok (8 h 15,
# 14 h 15, 18 h 15) et Instagram (11 h 15, 17 h 15, 20 h 15). Un passage sans rien à publier n'enregistre rien ; un
# passage manqué est rattrapé au suivant.
on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Europe/Paris"
    - cron: "29,41,53 8,11,14,17,18,20 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      maintenant:
        description: "Publier tout de suite les épisodes approuvés (ignore l'heure)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Dernier état de la branche, pas le commit figé au déclenchement : un run resté en file d'attente derrière
      # un autre voit ce que ce dernier vient d'enregistrer (sinon : envoi en double, journée refaite).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup
      - name: Publier les épisodes dont le créneau est arrivé
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FM_CLE_JETONS: ${{ secrets.FM_CLE_JETONS }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID || secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: npm run --silent fm -- publier ${{ inputs.maintenant && '--maintenant' || '' }}
      - name: Enregistrer
        if: always()
        env:
          ETAT_JOB: ${{ job.status }}
        run: |
          # Légendes TikTok prêtes à copier (page docs/legendes.html) : un brouillon ne peut pas recevoir de légende.
          npm run --silent fm -- legendes || true
          # Passage réussi sans rien de neuf (seule une ligne de journal « rien à publier ») : pas de commit. Tout autre
          # changement (épisodes, historique, jetons TikTok renouvelés) est toujours enregistré.
          if [ "$ETAT_JOB" = "success" ] && [ -z "$(git status --porcelain -- episodes data config | grep -v ' data/journal/' || true)" ]; then
            echo "Rien de neuf à enregistrer"; exit 0
          fi
          ./scripts/commit-etat.sh "Publication $(TZ=Europe/Paris date '+%F %H:%M')"
