name: Production quotidienne

on:
  schedule:
    - cron: "10 5 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      date:
        description: "Date à produire (AAAA-MM-JJ). Vide = aujourd'hui (heure de Paris)."
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rendu: "true"

      - name: Date de production
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          D="$INPUT_DATE"; [ -z "$D" ] && D=$(TZ=Europe/Paris date +%F)
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Date invalide"; exit 1; }
          echo "date=$D" >> "$GITHUB_OUTPUT"

      # L'agent n'a PAS accès aux identifiants de publication (YouTube/TikTok) : uniquement Claude, la voix et la lecture GitHub.
      - name: Agent de production (Claude Code)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DATE_PROD: ${{ steps.date.outputs.date }}
          CONSIGNE_OUTILS: "Mode automatique (GitHub Actions) : pour lire un fichier utilise Read, Glob ou Grep ; pour écrire, Write ou Edit ; pour le web, WebFetch ou WebSearch ; en shell, seulement « npm run fm -- … » (et ls, git status/diff/log). cat, node, curl et les scripts shell sont refusés par conception : ne t'arrête pas sur un refus, utilise l'outil prévu."
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "Utilise le skill produire-journee pour la date $DATE_PROD. Termine par le bilan demandé. $CONSIGNE_OUTILS" \
            --permission-mode dontAsk --permission-prompts none \
            --allowedTools "Bash(npm run fm:*)" "Bash(npm run --silent fm:*)" Read Write Edit Glob Grep WebFetch WebSearch Agent Task \
            --output-format stream-json --verbose > production.log.jsonl || echo "::warning::L'agent s'est arrêté avec une erreur"
          tail -c 4000 production.log.jsonl | tail -n 3 || true

      - name: Enregistrer la production
        run: ./scripts/commit-etat.sh "Production du ${{ steps.date.outputs.date }}"

      - name: Envoi en revue (YouTube privé + issue d'approbation)
        env:
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DATE_PROD: ${{ steps.date.outputs.date }}
        run: |
          MODE=$(node -e "console.log(require('./config/chaine.json').publication.mode)")
          for qc in episodes/${DATE_PROD}-*/qc.json; do
            [ -f "$qc" ] || continue
            id=$(basename "$(dirname "$qc")")
            ok=$(node -e "const q=require('./$qc'); const e=require('./episodes/$id/episode.json'); console.log(q.publiable && e.statut==='qc_ok' ? 'oui':'non')")
            if [ "$ok" = "oui" ]; then
              npm run --silent fm -- revue "$id"
              [ "$MODE" = "autonome" ] && npm run --silent fm -- approuver "$id"
            else
              echo "::warning::$id non publiable : pas d'envoi en revue"
            fi
          done

      - name: Enregistrer l'état de revue
        if: always()
        run: ./scripts/commit-etat.sh "Revue du ${{ steps.date.outputs.date }}"

      # L'agent peut s'arrêter « avec succès » sans rien produire : on vérifie le résultat réel.
      - name: Vérifier la production
        env:
          DATE_PROD: ${{ steps.date.outputs.date }}
        run: |
          if grep -q "has not been trusted" production.log.jsonl 2>/dev/null; then
            echo "::error::Claude Code a ignoré les permissions du dépôt (espace de travail non approuvé)"; exit 1
          fi
          total=0; ok=0
          for f in episodes/${DATE_PROD}-*/episode.json; do
            [ -f "$f" ] || continue
            total=$((total + 1))
            [ "$(node -e "console.log(require('./$f').statut)")" = "qc_ok" ] && ok=$((ok + 1))
          done
          echo "Épisodes du $DATE_PROD : $ok publiable(s) sur $total commencé(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$ok" -gt 0 ] || { echo "::error::Aucun épisode publiable pour le $DATE_PROD : voir le journal de l'agent (artefact)"; exit 1; }
          [ "$ok" -ge 3 ] || echo "::warning::$ok épisode(s) publiable(s) sur 3 (mieux vaut 2 parfaits que 3 moyens)"

      - name: Journal de l'agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ steps.date.outputs.date }}
          path: |
            production.log.jsonl
            data/journal/
          retention-days: 30

      - name: Alerte en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "⚠️ Production du ${{ steps.date.outputs.date }} en échec" \
            --body "Voir l'exécution : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
