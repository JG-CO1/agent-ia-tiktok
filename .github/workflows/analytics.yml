name: Statistiques et apprentissage

on:
  schedule:
    - cron: "20 7 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      bilan:
        description: "Lancer aussi le bilan hebdomadaire (Claude Code)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Collecte des statistiques réelles
        env:
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FM_CLE_JETONS: ${{ secrets.FM_CLE_JETONS }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          npm run --silent fm -- stats
          npm run --silent fm -- rapport --jours 14
      - name: Bilan (lundi ou à la demande)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FORCER: ${{ inputs.bilan }}
          CONSIGNE_OUTILS: "Mode automatique (GitHub Actions) : pour lire un fichier utilise Read, Glob ou Grep ; pour écrire, Write ou Edit ; en shell, seulement « npm run fm -- … ». cat, node, curl et les scripts shell sont refusés par conception : ne t'arrête pas sur un refus, utilise l'outil prévu."
        run: |
          if [ "$FORCER" = "true" ] || [ "$(TZ=Europe/Paris date +%u)" = "1" ]; then
            npx -y @anthropic-ai/claude-code@latest -p "Utilise le skill bilan-performances. $CONSIGNE_OUTILS" \
              --permission-mode dontAsk --permission-prompts none \
              --allowedTools "Bash(npm run fm:*)" "Bash(npm run --silent fm:*)" Read Write Edit Glob Grep \
              --output-format text > bilan.txt || true
            B=$(ls -t data/rapports/*-bilan.md 2>/dev/null | head -1)
            [ -n "$B" ] && gh issue create --title "📊 Bilan de la semaine ($(TZ=Europe/Paris date +%F))" --body-file "$B" || true
          fi
      - name: Enregistrer
        if: always()
        run: ./scripts/commit-etat.sh "Statistiques du $(TZ=Europe/Paris date +%F)"
