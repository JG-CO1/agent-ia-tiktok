name: Préparer le studio
description: Node 22, FFmpeg, hunspell-fr, ImageMagick, dépendances npm et navigateur de rendu Remotion.
inputs:
  rendu:
    description: "Installer le navigateur de rendu et Playwright (production)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Paquets système
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ffmpeg hunspell hunspell-fr imagemagick
    - name: Dépendances npm
      shell: bash
      run: npm ci --no-audit --no-fund
    # En mode non interactif, Claude Code ignore les permissions de .claude/settings.json tant que l'espace de travail
    # n'est pas « approuvé » (message : « set projects[<chemin>].hasTrustDialogAccepted: true in ~/.claude.json »).
    # Le dépôt extrait ici est le nôtre (branche par défaut, aucun code de pull request) : on l'approuve.
    - name: Approuver le dépôt pour Claude Code
      shell: bash
      run: node scripts/approuver-espace-claude.mjs "$GITHUB_WORKSPACE"
    - name: Navigateur de rendu (Remotion) et captures (Playwright)
      if: inputs.rendu == 'true'
      shell: bash
      run: |
        npx remotion browser ensure
        npx -y playwright@1 install --with-deps chromium
